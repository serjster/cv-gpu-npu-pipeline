[project]
name = "lowlatcv"
version = "0.1.0"
description = "Low-latency CV reference pipeline mirroring AMD Versal VEK385 (macOS + Linux/AMD parallel profiles)."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
authors = [{ name = "Sergio Soldado" }]
dependencies = [
    "typer>=0.12",
    "numpy>=2.0",
    "scipy>=1.13",
    "opencv-python-headless>=4.10",
    "pyyaml>=6.0",
    "pygame-ce>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]
detector-onnx = ["onnxruntime>=1.18"]
detector-onnx-amd = ["onnxruntime-migraphx ; sys_platform == 'linux'"]
detector-ultralytics = ["ultralytics>=8.3"]
detector-coreml = ["coremltools>=8"]
vlm-transformers = ["transformers>=4.45", "torch>=2.4"]

[tool.uv.sources]
onnxruntime-migraphx = { url = "https://github.com/Looong01/onnxruntime-rocm-build/releases/download/v1.25.0/onnxruntime_migraphx-1.25.0-cp313-cp313-manylinux_2_34_x86_64.whl", marker = "sys_platform == 'linux' and python_version == '3.13'" }

[project.scripts]
lowlatcv = "lowlatcv.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lowlatcv"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "PT"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]
"src/lowlatcv/app.py" = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["lowlatcv"]
ignore_missing_imports = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["lowlatcv.app"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]
